<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" shape-rendering="crispEdges">
  <!-- G-FurniMatic: the Furni-Matic's hopper, 8 slots for the next batch, being fed from above.
       Drawn on a 40x40 pixel grid so it stays crisp at the store's 40px size. -->

  <!-- Tile, stepped corners like the app's pixel frames -->
  <path fill="#1f2b33" d="M3 0h34v1h1v1h1v1h1v34h-1v1h-1v1h-1v1H3v-1H2v-1H1v-1H0V3h1V2h1V1h2z"/>

  <!-- Feed arrow -->
  <rect fill="#f4c140" x="18" y="3" width="4" height="4"/>
  <rect fill="#f4c140" x="15" y="7" width="10" height="1"/>
  <rect fill="#f4c140" x="16" y="8" width="8" height="1"/>
  <rect fill="#f4c140" x="17" y="9" width="6" height="1"/>
  <rect fill="#f4c140" x="18" y="10" width="4" height="1"/>
  <rect fill="#b88a17" x="19" y="11" width="2" height="1"/>

  <!-- Hopper rim and bed -->
  <path fill="#3d5262" d="M6 12h28v1h1v1h1v16h-1v1h-1v1H6v-1H5v-1H4V14h1v-1h1z"/>
  <rect fill="#16212a" x="6" y="14" width="28" height="16"/>

  <!-- Slots: six filled with furni, two still free -->
  <g fill="#f4c140">
    <rect x="7" y="15" width="5" height="6"/>
    <rect x="14" y="15" width="5" height="6"/>
    <rect x="21" y="15" width="5" height="6"/>
    <rect x="28" y="15" width="5" height="6"/>
    <rect x="7" y="23" width="5" height="6"/>
    <rect x="14" y="23" width="5" height="6"/>
  </g>
  <g fill="#b88a17">
    <rect x="7" y="20" width="5" height="1"/>
    <rect x="14" y="20" width="5" height="1"/>
    <rect x="21" y="20" width="5" height="1"/>
    <rect x="28" y="20" width="5" height="1"/>
    <rect x="7" y="28" width="5" height="1"/>
    <rect x="14" y="28" width="5" height="1"/>
  </g>
  <g fill="#2a3a45">
    <rect x="21" y="23" width="5" height="6"/>
    <rect x="28" y="23" width="5" height="6"/>
  </g>

  <!-- Progress meter under the hopper -->
  <rect fill="#16212a" x="6" y="34" width="28" height="2"/>
  <rect fill="#f4c140" x="6" y="34" width="19" height="2"/>
</svg>
